[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cz-certification-automation"
version = "0.6.0"
description = "Cited evidence, normalization, and grounding pipeline for generic CZ portals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40,<2.0",
    "pydantic>=2.0,<3.0",
]

[project.scripts]
cz-crawl = "scraper.cli:entrypoint"
cz-normalize = "knowledge.cli:entrypoint"
cz-ground = "grounding.cli:entrypoint"

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*", "knowledge*", "grounding*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_equality = true
